  <text x="760" y="34" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#64748b">unit_prompt_protocol · one block per model family</text>
  <text x="48" y="88" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#7dd3fc" opacity="0.9">src/coding/unit_prompt_protocol.py  ·  MODEL_OPTI.md</text>
  <text x="48" y="116" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#cbd5e1"><tspan fill="#64748b">13 families · 1 exact-model override · every block counters one documented trait</tspan></text><text x="48" y="164" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#cbd5e1"><tspan fill="#7dd3fc">  gpt        </tspan><tspan fill="#cbd5e1">act on the decisive fact; a passed criterion is settled evidence</tspan></text><text x="48" y="188" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#cbd5e1"><tspan fill="#fbbf24">  gpt-6-astra</tspan><tspan fill="#cbd5e1"> criteria are the whole job; ask once, only if it changes the answer</tspan></text><text x="48" y="212" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#cbd5e1"><tspan fill="#7dd3fc">  claude     </tspan><tspan fill="#cbd5e1">the numbered criteria are the complete checklist; never grow it mid-run</tspan></text><text x="48" y="236" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#cbd5e1"><tspan fill="#7dd3fc">  gemini     </tspan><tspan fill="#cbd5e1">a claim without the tool output that proves it is not evidence</tspan></text><text x="48" y="260" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#cbd5e1"><tspan fill="#7dd3fc">  deepseek   </tspan><tspan fill="#cbd5e1">version and thinking mode are contract fields; no legacy R1 prompting</tspan></text><text x="48" y="284" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#cbd5e1"><tspan fill="#7dd3fc">  qwen       </tspan><tspan fill="#cbd5e1">Qwen3-Coder is non-thinking; never ask for reasoning tags</tspan></text><text x="48" y="308" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#cbd5e1"><tspan fill="#7dd3fc">  glm        </tspan><tspan fill="#cbd5e1">interleave reasoning only where it improves the next tool decision</tspan></text><text x="48" y="332" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#cbd5e1"><tspan fill="#7dd3fc">  kimi       </tspan><tspan fill="#cbd5e1">decompose-compare-verify for the hard parts; mechanical steps run direct</tspan></text><text x="48" y="356" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#cbd5e1"><tspan fill="#64748b">  grok · mistral · llama · codestral · solar · generic</tspan></text><text x="48" y="404" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#cbd5e1"><tspan fill="#67e8f9">$ </tspan><tspan fill="#f8fafc">omh coding model-contract --model gpt-6-astra</tspan></text><text x="48" y="428" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#cbd5e1"><tspan fill="#cbd5e1">- reasoning efforts: low, medium, high, xhigh, max </tspan><tspan fill="#fbbf24">(floor `low`)</tspan></text><text x="48" y="452" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#cbd5e1"><tspan fill="#cbd5e1">- tool calling: responses API only · unsupported: temperature, top_p, top_logprobs</tspan></text><text x="48" y="476" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#cbd5e1"><tspan fill="#cbd5e1">- context 1,050,000 · input 922,000 · output 128,000 · sources cited 2026-09-04</tspan></text><text x="48" y="524" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#cbd5e1"><tspan fill="#64748b">measured 2026-09-05: </tspan><tspan fill="#4ade80">draft +10% tokens, same answers → one clause cut</tspan><tspan fill="#cbd5e1"> · shipped: −5% turns</tspan></text>
