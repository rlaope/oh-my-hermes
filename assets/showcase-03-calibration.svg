<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="562" viewBox="0 0 1100 562"><rect width="1100" height="562" rx="0" fill="#0b0f14"/><text x="28" y="45" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#5fd4e0">› </tspan><tspan fill="#f4f6f8">hand the parser rewrite to astra</tspan></text><text x="28" y="68" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#c5ccd6">model    gpt-6-astra   contract: efforts low..max, floor low, tool calls via Responses API</tspan></text><text x="28" y="91" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#6b7683">prompt   </tspan><tspan fill="#c5ccd6">2 lines added for this model</tspan><tspan fill="#6b7683"> (every family has its own)</tspan></text><text x="28" y="114" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#c5ccd6">         the numbered criteria are the whole job; nothing outside them is owed</tspan></text><text x="28" y="137" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#c5ccd6">         ask once, only if a missing input changes the answer; otherwise assume and go</tspan></text><text x="28" y="183" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#6b7683">  one block per model family · what each line corrects</tspan></text><text x="28" y="206" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#5fd4e0">   gpt        </tspan><tspan fill="#c5ccd6">once the key fact is known, act; a passed check stays passed</tspan></text><text x="28" y="229" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#5fd4e0">   claude     </tspan><tspan fill="#c5ccd6">the checklist is complete; do not add to it mid-run</tspan></text><text x="28" y="252" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#5fd4e0">   gemini     </tspan><tspan fill="#c5ccd6">a claim with no tool output is not evidence</tspan></text><text x="28" y="275" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#5fd4e0">   qwen       </tspan><tspan fill="#c5ccd6">no thinking tags; it is a non-thinking coder</tspan></text><text x="28" y="298" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#5fd4e0">   deepseek   </tspan><tspan fill="#c5ccd6">respect the declared thinking mode; no R1 habits</tspan></text><text x="28" y="321" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#5fd4e0">   glm        </tspan><tspan fill="#c5ccd6">reason between tool calls only when it changes the next call</tspan></text><text x="28" y="344" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#5fd4e0">   kimi       </tspan><tspan fill="#c5ccd6">decompose only the hard parts; do the easy ones directly</tspan></text><text x="28" y="367" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#6b7683">   + grok, mistral, llama, codestral, solar, generic</tspan></text><text x="28" y="413" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#6b7683">  measured: gpt-6-astra, same 30 tasks, every arm solved 18</tspan></text><text x="28" y="436" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#6b7683">   no block        </tspan><tspan fill="#c5ccd6">██████████████████████░░</tspan><tspan fill="#c5ccd6">  1.55M tokens</tspan></text><text x="28" y="459" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#6b7683">   first draft     </tspan><tspan fill="#e57373">████████████████████████</tspan><tspan fill="#e57373">  1.68M  +10%  (kept working on tasks it could not pass)</tspan></text><text x="28" y="482" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#6b7683">   shipped block   </tspan><tspan fill="#63d47f">██████████████████████░░</tspan><tspan fill="#63d47f">  1.53M  -5% turns</tspan></text><text x="28" y="528" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#5fd4e0">› </tspan><tspan fill="#f4f6f8">▌</tspan></text></svg>