fill="#5fd4e0">  ├ ● </tspan><tspan fill="#c5ccd6">Skill View("omh-verification-gate")</tspan><tspan fill="#6b7683"> (0.1s)</tspan></text><text x="28" y="206" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#5fd4e0">  ├ ● </tspan><tspan fill="#c5ccd6">Skill View("omh-security-safety-review")</tspan><tspan fill="#6b7683"> (0.1s)</tspan></text><text x="28" y="229" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#5fd4e0">  ├ ● </tspan><tspan fill="#c5ccd6">Skill View("omh-performance-goal")</tspan><tspan fill="#6b7683"> (0.1s)</tspan></text><text x="28" y="252" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#5fd4e0">  ├ ● </tspan><tspan fill="#c5ccd6">Skill View("omh-code-review")</tspan><tspan fill="#6b7683"> (0.1s)</tspan></text><text x="28" y="298" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#6b7683">lane backend      </tspan><tspan fill="#c5ccd6">omh-backend + omh-security-safety-review</tspan><tspan fill="#6b7683">    endpoint shape, migration, auth boundary</tspan></text><text x="28" y="321" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#6b7683">lane frontend     </tspan><tspan fill="#c5ccd6">omh-frontend + omh-design-quality-gate</tspan><tspan fill="#6b7683">      form state, a11y, visual check before the diff lands</tspan></text><text x="28" y="344" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#6b7683">lane verification </tspan><tspan fill="#c5ccd6">omh-verification-gate + omh-performance-goal</tspan><tspan fill="#6b7683"> the gate the run must pass; one perf budget</tspan></text><text x="28" y="367" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#6b7683">review            </tspan><tspan fill="#c5ccd6">omh-code-review</tspan><tspan fill="#6b7683">                               P0–P3 verdicts on the change</tspan></text><text x="28" y="413" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#6b7683">  you did not ask for any of these. the request named a frontend, an API, and a gate;</tspan></text><text x="28" y="436" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#6b7683">  the matching skills were already in the run. 108 omh-* skills, generated from one catalog.</tspan></text><text x="28" y="482" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#6b7683">   a few more:  omh-rust  omh-native-debugging  omh-inference-serving  omh-llm-app-dev</tspan></text><text x="28" y="505" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#6b7683">                omh-refactor-plan  omh-tech-debt-audit  omh-reliability-review  omh-ops-review</tspan></text><text x="28" y="551" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#5fd4e0">› </tspan><tspan fill="#f4f6f8">▌</tspan></text></svg>