on Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#63d47f">  ◆ </tspan><tspan fill="#c5ccd6">release gate runs after the shard plan</tspan><tspan fill="#6b7683">            active · pinned · 3d old</tspan></text><text x="28" y="413" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#63d47f">  ● </tspan><tspan fill="#c5ccd6">do not merge to main while Cut Release runs</tspan><tspan fill="#6b7683">      active · 1d old · from run 33944204146</tspan></text><text x="28" y="436" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#e0b455">  ● </tspan><tspan fill="#c5ccd6">npm publish waits for one human approval</tspan><tspan fill="#6b7683">         reference · confirmed 2026-08-29</tspan></text><text x="28" y="459" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#6b7683">  conflicts 0 · duplicates 1 merged · stale 0 · 463 left out (ranked lower or archived)</tspan></text><text x="28" y="505" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#6b7683">   one record over time</tspan></text><text x="28" y="528" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#c5ccd6">   captured ──▶ approved ──▶ confirmed ──▶ reference ──▶ archive</tspan></text><text x="28" y="551" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#6b7683">   candidate     active,       still true,     not recalled     kept, not</tspan>