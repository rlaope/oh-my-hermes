<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="884" viewBox="0 0 1100 884"><rect width="1100" height="884" rx="0" fill="#0b0f14"/><text x="28" y="45" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#5fd4e0">› </tspan><tspan fill="#f4f6f8">draw this repo, then tell me what to fix first</tspan></text><text x="28" y="68" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#6b7683">└ ▾ Tool calls (</tspan><tspan fill="#6b7683">4</tspan><tspan fill="#6b7683">)</tspan></text><text x="28" y="91" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#5fd4e0">  ├ ● </tspan><tspan fill="#c5ccd6">omh_codegraph(scan)</tspan><tspan fill="#6b7683"> (0.8s)</tspan></text><text x="28" y="114" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#5fd4e0">  ├ ● </tspan><tspan fill="#c5ccd6">omh_codegraph(uml)</tspan><tspan fill="#6b7683"> (0.3s)</tspan></text><text x="28" y="137" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#5fd4e0">  ├ ● </tspan><tspan fill="#c5ccd6">Skill View("omh-refactor-plan")</tspan><tspan fill="#6b7683"> (0.1s)</tspan></text><text x="28" y="160" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#5fd4e0">  ├ ● </tspan><tspan fill="#c5ccd6">Skill View("omh-tech-debt-audit")</tspan><tspan fill="#6b7683"> (0.1s)</tspan></text><text x="28" y="206" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#c5ccd6">6 packages, 41 modules, 2 import cycles</tspan></text><text x="28" y="252" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#c5ccd6">    ┌──────────────┐        ┌──────────────┐</tspan></text><text x="28" y="275" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#c5ccd6">    │ src/routing  │ ─────▶ │ src/coding   │</tspan></text><text x="28" y="298" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#c5ccd6">    └──────┬───────┘        └──────┬───────┘</tspan></text><text x="28" y="321" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#c5ccd6">           │          </tspan><tspan fill="#e57373">◀ ─ ─ ─ ─ ─ ┐</tspan><tspan fill="#c5ccd6">      │</tspan></text><text x="28" y="344" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#c5ccd6">           ▼          </tspan><tspan fill="#e57373">          ┊</tspan><tspan fill="#c5ccd6">      ▼</tspan></text><text x="28" y="367" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#c5ccd6">    ┌──────────────┐        ┌──────┴───────┐</tspan></text><text x="28" y="390" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#c5ccd6">    │ src/wrapper  │ ─────▶ │ plugin_bundle│</tspan><tspan fill="#e57373">   cycle 1: plugin_bundle → routing</tspan></text><text x="28" y="413" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#c5ccd6">    └──────┬───────┘        └──────┬───────┘</tspan></text><text x="28" y="436" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#c5ccd6">           ▼                       ▼</tspan></text><text x="28" y="459" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#c5ccd6">    ┌──────────────┐        ┌──────────────┐</tspan></text><text x="28" y="482" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#c5ccd6">    │ src/skills   │ ─────▶ │ src/quality  │</tspan><tspan fill="#e57373"> ─ ─ ▶ coding   cycle 2: quality → coding</tspan></text><text x="28" y="505" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#c5ccd6">    └──────────────┘        └──────────────┘</tspan></text><text x="28" y="551" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#c5ccd6">P1  plugin_bundle imports routing.chat for one type</tspan></text><text x="28" y="574" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#c5ccd6">P1  quality imports coding.fanout to score budgets</tspan></text><text x="28" y="597" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#c5ccd6">P2  wrapper/contract.py is 1,900 lines</tspan></text><text x="28" y="620" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#c5ccd6">P3  3 modules re-export instead of own</tspan></text><text x="28" y="666" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#6b7683">plan, 4 phases, one PR each, tests lock behavior, stops if a lock breaks</tspan></text><text x="28" y="689" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#6b7683">[x] </tspan><tspan fill="#c5ccd6">1  extract the shared types into src/coding/contracts</tspan></text><text x="28" y="712" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#63d47f">[•] </tspan><tspan fill="#63d47f">2  point plugin_bundle at that seam; drop the import</tspan></text><text x="28" y="735" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#6b7683">[ ] </tspan><tspan fill="#c5ccd6">3  move budget scoring out of quality</tspan></text><text x="28" y="758" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#6b7683">[ ] </tspan><tspan fill="#c5ccd6">4  split wrapper/contract.py by session vs render</tspan></text><text x="28" y="804" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#6b7683">   after phase 2   cycles 2 → </tspan><tspan fill="#63d47f">0</tspan><tspan fill="#6b7683">    cross-package imports 17 → </tspan><tspan fill="#63d47f">9</tspan><tspan fill="#6b7683">    tests 9,304 ok</tspan></text><text x="28" y="850" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#5fd4e0">› </tspan><tspan fill="#f4f6f8">▌</tspan></text></svg>