<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="516" viewBox="0 0 1560 516"><rect width="1560" height="516" rx="0" fill="#0b0f14"/><text x="28" y="45" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#5fd4e0">› </tspan><tspan fill="#f4f6f8">show my model chains</tspan></text><text x="28" y="68" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#6b7683">~/.omh/routing/model-chains.json  </tspan><tspan fill="#6b7683">shipped defaults, nothing overridden</tspan></text><text x="28" y="91" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#c5ccd6">  ultrabrain          </tspan><tspan fill="#e0b455">gpt-6-astra xhigh</tspan><tspan fill="#c5ccd6">  &gt;  gpt-5.6-sol xhigh</tspan></text><text x="28" y="114" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#c5ccd6">  deep                </tspan><tspan fill="#e0b455">gpt-5.6-terra high</tspan><tspan fill="#c5ccd6">  &gt;  deepseek-v3.2 high</tspan></text><text x="28" y="137" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#c5ccd6">  architect           </tspan><tspan fill="#e0b455">claude-fable-5-1 xhigh</tspan><tspan fill="#c5ccd6">  &gt;  claude-fable-5 xhigh  &gt;  gpt-6-astra xhigh  &gt;  gpt-5.6-sol xhigh  &gt;  kimi-k3 xhigh</tspan></text><text x="28" y="160" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#c5ccd6">  unspecified-high    </tspan><tspan fill="#e0b455">kimi-k3 medium</tspan><tspan fill="#c5ccd6">  &gt;  claude-opus-5 medium</tspan></text><text x="28" y="183" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#c5ccd6">  unspecified-low     </tspan><tspan fill="#e0b455">glm-5.3 low</tspan><tspan fill="#c5ccd6">  &gt;  glm-5.2 low  &gt;  glm-5.2-ultrafast low  &gt;  deepseek-v3.2 low  &gt;  claude-opus-5 low</tspan></text><text x="28" y="206" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#c5ccd6">  quick               </tspan><tspan fill="#63d47f">glm-5.3-flash low</tspan><tspan fill="#c5ccd6">  &gt;  glm-5.2-ultrafast low  &gt;  kimi-k3 low  &gt;  gpt-5.6-luna low  &gt;  claude-fable-5-1 low  &gt;  claude-fable-5 low</tspan></text><text x="28" y="229" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#c5ccd6">  writing             </tspan><tspan fill="#e0b455">kimi-k3 medium</tspan><tspan fill="#c5ccd6">  &gt;  qwen3-coder medium  &gt;  gemini-3.1-pro medium</tspan></text><text x="28" y="252" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#c5ccd6">  visual-engineering  </tspan><tspan fill="#e0b455">claude-fable-5-1 high</tspan><tspan fill="#c5ccd6">  &gt;  claude-fable-5 high  &gt;  kimi-k3 high</tspan></text><text x="28" y="275" xml:space="preserve" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#c5ccd6"><tspan fill="#3a4350">│ </tspan><tspan fill="#c5ccd6">  artistry            </tspan><tspan fill="#e0b455">gemini-3.1-pro high</