[package]
name = "omher"
version = "1.2.4"
edition = "2021"

[lib]
name = "omher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
getrandom = "0.3"
sha2 = "0.10"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
portable-pty = "0.9"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# omher://terminal/<id> links: the OS hands them to omher (term_link.rs takes only that shape)
tauri-plugin-deep-link = "2"
# Settings › Terminal › Import from…: iTerm2 / Apple Terminal prefs (term_import.rs); already in the tree via tauri
plist = "1"
# Tasks › 나: a non-active GitHub account's token is wiped from memory when its one `gh` call ends (gh_me.rs); already in
# the tree via tauri
zeroize = "1"
# Continue a past conversation: one key per folder in NFC, and a Claude Code project folder's slug from the cwd's NFC
# and NFD forms (past_chats.rs); already in the tree via tauri (url's IDNA), with only the baked data it uses there
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows and Linux: a link opened while omher runs starts a second omher; this hands its link to the first one.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Linux: the opener plugin's own launcher list, run with the AppImage environment taken out (src/appimage.rs).
[target.'cfg(target_os = "linux")'.dependencies]
open = "5"
# Linux: the webview's `enable-media-stream` setting for the composer's microphone (src/voice.rs); the version wry pins,
# already in the tree, with only the feature that setting needs
webkit2gtk = { version = "=2.0.2", features = ["v2_4"] }
