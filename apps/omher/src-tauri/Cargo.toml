[package]
name = "omher"
version = "0.1.0"
edition = "2021"

[lib]
name = "omher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"

# The CLIProxyAPI management key lives in the OS keychain (macOS Keychain, Windows Credential Manager).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

# Linux: the kernel keyring (no system library to build against; the key lasts until logout).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", features = ["linux-native"] }
