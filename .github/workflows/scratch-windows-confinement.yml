name: scratch-windows-confinement
on:
  push:
    branches: [omh/scratch-windows-confinement]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: whoami
        run: whoami /groups /priv
        continue-on-error: true
      - name: experiment
        run: python tools/scratch_rt_experiment.py
        continue-on-error: true
      - name: experiment piped
        shell: cmd
        run: python tools/scratch_rt_experiment.py < NUL > exp.txt 2>&1 & type exp.txt
        continue-on-error: true
      - name: confinement tests
        env:
          PYTHONPATH: tests
        run: python -m unittest tests.test_fanout_confinement tests.test_data_boundary tests.test_cross_harness_adapters -v
