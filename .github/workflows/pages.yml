name: Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "site/**"
      - "skills/**"
      - "tools/render_site_skills.py"
      - "tools/stamp_site_counts.py"
      - "README.md"
      - "docs/**"
  workflow_dispatch:
  # Rebake the GitHub star count every 6 hours without a merge. A scheduled
  # run builds the default branch head, so it deploys the same content as
  # the latest push to main, plus the fresh count.
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write

concurrency:
  group: "pages"
  # A scheduled refresh queues behind a running deploy instead of cancelling
  # it; a push still supersedes whatever is running.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Check generated docs
        run: python -m omh.cli docs workflows --check
      - name: Validate harness catalog
        run: python -m omh.cli harness validate
      - name: Refresh the skill guide from skills/*/SKILL.md
        run: python tools/render_site_skills.py --write
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site/assets
          # site/assets is self-contained: the DAG-ULW capture (webm/mp4 and
          # poster), the logo, and the wordmark are tracked under site/.
          cp -R site/. _site/
      - name: Bake the GitHub star count into the site
        # Fills every [data-stars] / [data-star-count] placeholder in _site.
        # The token only lifts the API rate limit and is never printed; a
        # failed call keeps the committed value and does not fail the deploy.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/stamp_site_counts.py _site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_final_retry.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before Pages deploy retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - name: Retry deploy after transient Pages failure
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before final Pages deploy retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 120
      - name: Final retry deploy after transient Pages failure
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        id: deployment_final_retry
        uses: actions/deploy-pages@v5
