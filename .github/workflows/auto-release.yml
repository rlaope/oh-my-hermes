name: Cut Release

# Runs the mechanics of a stable patch release -- bump every version surface,
# gate, tag, dispatch the distribution workflow -- but only when a maintainer
# asks for one. There is deliberately NO schedule: deciding that main's
# current state is worth a version belongs to a person. An earlier revision
# of this file cut a release every day, which moved the public version
# without anyone choosing to, and made the number meaningless.
#
# The tag and the workflow_dispatch of release.yml are both created with
# GITHUB_TOKEN on purpose: a GITHUB_TOKEN tag push cannot trigger the
# tag-push path of release.yml, and workflow_dispatch is the documented
# exception that still creates a run.

on:
  workflow_dispatch:

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cut:
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      # The full-suite gate below includes the npm/Bun launcher tests, which
      # require the same node and bun toolchain CI installs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Decide whether main needs a release
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          version="$(uv run tools/package_manager/metadata.py --version)"
          if ! git show-ref --verify --quiet "refs/tags/v$version"; then
            echo "v$version is staged for a manual release; not interfering"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(git rev-list -n 1 "v$version")" = "$(git rev-parse HEAD)" ]; then
            echo "main tip is already released as v$version"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Bump every version surface
        if: steps.decide.outputs.proceed == 'true'
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          new_version="$(uv run tools/package_manager/bump_version.py)"
          if git show-ref --verify --quiet "refs/tags/v$new_version"; then
            echo "tag v$new_version already exists; refusing to reuse it" >&2
            exit 1
          fi
          uv run python -m omh.cli release prepare --version "$new_version" \
            --repo-root "$GITHUB_WORKSPACE" --notes-file "$RUNNER_TEMP/release-notes.md" --json
          git add CHANGELOG.md
          echo "version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Run release gates on the bumped tree
        if: steps.decide.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tests uv run python -m unittest discover -s tests
          uv run python -m compileall -q src tests

      - name: Commit, tag, and push atomically
        if: steps.decide.outputs.proceed == 'true'
        shell: bash
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md pyproject.toml src/omh/version.py \
            src/plugin_bundle/omh/plugin.yaml .release-channel \
            site/index.html site/i18n.js
          git commit -s -m "chore(release): cut v$NEW_VERSION

          Constraint: npm/Bun, the GitHub wheel, and the Homebrew tap publish only from vX.Y.Z tags, so a release requires this version-bump commit on main
          Rejected: any automatic trigger | choosing that main is worth a version is a maintainer decision, not a schedule's
          Confidence: high
          Scope-risk: narrow
          Directive: this commit exists because a maintainer ran the Cut Release workflow; never add a trigger that creates it unattended
          Tested: full unittest suite and compileall on the bumped tree inside this workflow run
          Not-tested: npm environment approval and downstream release.yml publication happen after this commit"
          git tag "v$NEW_VERSION"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$NEW_VERSION"

      - name: Dispatch the distribution release
        if: steps.decide.outputs.proceed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main --field tag="v$NEW_VERSION"
          echo "release.yml dispatched for v$NEW_VERSION;" \
            "publication still waits for the npm environment approval"

      - name: Dispatch the public site rebuild
        if: steps.decide.outputs.proceed == 'true'
        # The tag, the release and the distribution dispatch have all already
        # happened by the time this runs, and the site badge is not part of
        # what a release IS. A dispatch that fails for a reason of its own --
        # the API refusing, this workflow renamed, a token scope changed --
        # must not repaint a cut that worked as a failed one. The step still
        # goes red on its own row, so the failure is visible and actionable;
        # the job does not, so a red cut keeps meaning the release did not
        # happen. The distribution dispatch above is deliberately NOT treated
        # this way: if that one fails nothing publishes, and red is true.
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          # The push above is made with GITHUB_TOKEN, and GitHub does not
          # create workflow runs from events that token caused. Pages triggers
          # on `push` to main under `site/**`, which the version bump always
          # rewrites, so Pages has never fired for a cut: the public badge
          # keeps the previous version until some later merge happens to touch
          # a path Pages watches. The step above dispatches distribution
          # explicitly for exactly this reason; the site needs the same, or
          # the page advertising the release is the one surface still naming
          # the release before it.
          gh workflow run pages.yml --ref main
          echo "pages.yml dispatched; the public badge follows v$NEW_VERSION"
