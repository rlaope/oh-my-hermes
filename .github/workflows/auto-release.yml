name: Cut Release

# Runs the mechanics of a stable patch release -- bump every version surface,
# gate, tag, dispatch the distribution workflow -- but only when a maintainer
# asks for one. There is deliberately NO schedule: deciding that main's
# current state is worth a version belongs to a person. An earlier revision
# of this file cut a release every day, which moved the public version
# without anyone choosing to, and made the number meaningless.
#
# The tag and the workflow_dispatch of release.yml are both created with
# GITHUB_TOKEN on purpose: a GITHUB_TOKEN tag push cannot trigger the
# tag-push path of release.yml, and workflow_dispatch is the documented
# exception that still creates a run.

on:
  workflow_dispatch:

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cut:
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      # The full-suite gate below includes the npm/Bun launcher tests, which
      # require the same node and bun toolchain CI installs.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Decide whether main needs a release
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          version="$(uv run tools/package_manager/metadata.py --version)"
          if ! git show-ref --verify --quiet "refs/tags/v$version"; then
            echo "v$version is staged for a manual release; not interfering"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(git rev-list -n 1 "v$version")" = "$(git rev-parse HEAD)" ]; then
            echo "main tip is already released as v$version"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Bump every version surface
        if: steps.decide.outputs.proceed == 'true'
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          new_version="$(uv run tools/package_manager/bump_version.py)"
          if git show-ref --verify --quiet "refs/tags/v$new_version"; then
            echo "tag v$new_version already exists; refusing to reuse it" >&2
            exit 1
          fi
          echo "version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Run release gates on the bumped tree
        if: steps.decide.outputs.proceed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=tests uv run python -m unittest discover -s tests
          uv run python -m compileall -q src tests

      - name: Commit, tag, and push atomically
        if: steps.decide.outputs.proceed == 'true'
        shell: bash
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/omh/version.py \
            src/plugin_bundle/omh/plugin.yaml .release-channel \
            site/index.html site/i18n.js
          git commit -s -m "chore(release): cut v$NEW_VERSION

          Constraint: npm/Bun, the GitHub wheel, and the Homebrew tap publish only from vX.Y.Z tags, so a release requires this version-bump commit on main
          Rejected: any automatic trigger | choosing that main is worth a version is a maintainer decision, not a schedule's
          Confidence: high
          Scope-risk: narrow
          Directive: this commit exists because a maintainer ran the Cut Release workflow; never add a trigger that creates it unattended
          Tested: full unittest suite and compileall on the bumped tree inside this workflow run
          Not-tested: npm environment approval and downstream release.yml publication happen after this commit"
          git tag "v$NEW_VERSION"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$NEW_VERSION"

      - name: Dispatch the distribution release
        if: steps.decide.outputs.proceed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main --field tag="v$NEW_VERSION"
          echo "release.yml dispatched for v$NEW_VERSION;" \
            "publication still waits for the npm environment approval"
