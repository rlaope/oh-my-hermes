          from pathlib import Path
          target = Path(sys.argv[1])
          wheel = next(Path("dist").glob("oh_my_hermes-*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              members = [name for name in archive.namelist() if name.startswith("omh/plugin_bundle/omh/")]
              if not members:
                  raise SystemExit(f"{wheel} carries no omh/plugin_bundle/omh payload")
              for name in members:
                  archive.extract(name, target)
          print(f"staged {len(members)} files from {wheel.name}")
          PY
          echo "OMH_SHA=$OMH_SHA" >> "$GITHUB_ENV"
      - name: Acquire the immutable Hermes host and bootstrap its PM environment
        env:
          HOST_REF: ${{ matrix.host == 'stable' && env.HERMES_STABLE_TAG || env.HERMES_MAIN_REF }}
          HOST_DIR: ${{ runner.temp }}/hermes-host
        run: |
