name: omh
kind: standalone
version: "2.0.3"
requires_hermes: ">=0.21.1,<0.22.0"
description: "Oh My Hermes native bridge for metadata-only runtime status, HUD, role context, bounded evidence probes, evidence-boundary context, and a deterministic file-backed memory provider."
author: oh-my-hermes maintainers
provides_memory_provider: omh
provides_tools:
  - omh_agent_board
  - omh_capabilities
  - omh_context
  - omh_decision_gate
  - omh_delegate_route
  - omh_document_plan
  - omh_gather_evidence
  - omh_hud
  - omh_interact
  - omh_loop
  - omh_memory
  - omh_probe
  - omh_recommend
  - omh_role
  - omh_run_summary
  - omh_source_trust
  - omh_status
  - omh_todo
provides_hooks:
  - on_session_end
  - post_tool_call
  - pre_llm_call
  - pre_tool_call
  - pre_verify
  - subagent_start
  - transform_tool_result
